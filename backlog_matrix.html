<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백로그 우선순위 매트릭스</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--s1:#181818;--s2:#222;--bd:#2e2e2e;--bd2:#3a3a3a;--t:#e8e4dc;--t2:#8a8680;--t3:#4a4844;--ac:#d4ff4e;--now:#ff6b35;--later:#4e9fff;--r:6px;--r2:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding:20px 18px 40px}
/* header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.title{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-bottom:3px}
.subtitle{font-size:11px;color:var(--t2);font-family:'IBM Plex Mono',monospace}
.hdr-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:3px 10px;border-radius:999px;border:1px solid var(--bd2);color:var(--t2);background:var(--s1)}
.badge.now{border-color:var(--now);color:var(--now)}
.badge.later{border-color:var(--later);color:var(--later)}
/* token row */
.token-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.token-label{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t2);white-space:nowrap}
.token-input{flex:1;min-width:200px;max-width:320px;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);padding:5px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--t);outline:none;transition:border-color .15s}
.token-input:focus{border-color:var(--ac)}
.token-input::placeholder{color:var(--t3)}
.refresh-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 13px;border-radius:var(--r);border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.refresh-btn:hover{background:var(--ac);color:#000}
.refresh-btn:active{transform:scale(.97)}
.refresh-btn:disabled{opacity:.4;cursor:not-allowed}
.spin{width:11px;height:11px;border:1.5px solid rgba(212,255,78,.3);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* filters */
.filters{display:flex;align-items:center;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.fl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3);margin-right:2px}
.fb{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:3px 11px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s}
.fb:hover{color:var(--t);border-color:var(--bd2)}
.fb.active{background:var(--s2);border-color:var(--t2);color:var(--t)}
.fb.fn.active{border-color:var(--now);color:var(--now);background:rgba(255,107,53,.08)}
.fb.fl2.active{border-color:var(--later);color:var(--later);background:rgba(78,159,255,.08)}
.vsep{width:1px;height:14px;background:var(--bd);margin:0 3px}
/* legend */
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t2)}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* main layout */
.main{display:grid;grid-template-columns:56px 1fr;gap:0}
.y-axis{display:flex;justify-content:flex-end;padding-right:8px;padding-top:30px;align-items:center}
.y-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3);letter-spacing:.04em;text-align:center}
.matrix-col{flex:1}
.col-hdrs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:4px}
.ch{text-align:center;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3)}
.gwr{display:grid;grid-template-columns:32px 1fr;border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden}
.row-labels{display:grid;grid-template-rows:1fr 1fr 1fr;background:var(--s1);border-right:1px solid var(--bd)}
.rl{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--t3);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
/* cells */
.cell{border:.5px solid var(--bd);padding:8px;min-height:120px}
.cell.zn{background:rgba(212,255,78,.025)}
.cell.zl{background:rgba(78,159,255,.025)}
.cell.zr{background:rgba(255,107,53,.025)}
.cell.zd{background:rgba(255,255,255,.008)}
.czb{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.zdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* cards */
.cards{display:flex;flex-direction:column;gap:3px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:6px 8px;cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--bd2);background:var(--s2)}
.card-hdr{display:flex;align-items:flex-start;gap:5px}
.pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:3px}
.cname{font-size:11px;color:var(--t);line-height:1.4}
.cmeta{display:flex;align-items:center;gap:5px;margin-top:4px;padding-top:4px;border-top:1px solid var(--bd);flex-wrap:wrap}
.ctag{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--t3);padding:1px 5px;border-radius:3px;border:1px solid var(--bd)}
.ctag.cnow{border-color:rgba(255,107,53,.4);color:var(--now)}
.ctag.clater{border-color:rgba(78,159,255,.4);color:var(--later)}
.empty-c{font-size:10px;color:var(--t3);font-family:'IBM Plex Mono',monospace}
/* x axis */
.x-axis{display:flex;align-items:center;gap:6px;margin-top:6px;padding-left:32px}
.xl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3)}
.xline{flex:1;height:1px;background:var(--bd);margin:0 6px}
/* error / status */
.err{font-size:11px;color:#ff6b6b;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:var(--r);padding:7px 11px;margin-bottom:11px;display:none;font-family:'IBM Plex Mono',monospace}
.sbar{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3);margin-top:10px;text-align:right}
/* detail overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.panel{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r2);width:100%;max-width:430px;padding:22px;position:relative;animation:su .18s ease}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pclose{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pclose:hover{background:var(--s2)}
.pbadges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.pb{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:999px;border:1px solid var(--bd2);color:var(--t2)}
.ptitle{font-size:15px;font-weight:600;color:var(--t);margin-bottom:14px;line-height:1.4;padding-right:30px}
.psec{margin-bottom:12px}
.pslbl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pstxt{font-size:13px;color:var(--t2);line-height:1.6}
.pdiv{height:1px;background:var(--bd);margin:12px 0}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="title">백로그 우선순위 × 복잡도 매트릭스</div>
    <div class="subtitle">카드 클릭 시 상세 내용 표시</div>
  </div>
  <div class="hdr-right">
    <span class="badge" id="tb">— 개 항목</span>
    <span class="badge now" id="nb">🔥 NOW —</span>
    <span class="badge later" id="lb">⏳ LATER —</span>
  </div>
</div>

<div class="token-row">
  <span class="token-label">Notion Token</span>
  <input type="password" id="ti" class="token-input" placeholder="secret_xxxxxxxxxxxxxxxxxxxx" autocomplete="off"/>
  <button class="refresh-btn" id="rb" onclick="load()">
    <span id="bi">↻</span> 노션에서 업데이트
  </button>
</div>

<div class="err" id="err"></div>

<div class="filters">
  <span class="fl">필터:</span>
  <button class="fb active"     onclick="sf('all',this)">전체</button>
  <button class="fb fn"         onclick="sf('now',this)">🔥 NOW</button>
  <button class="fb fl2"        onclick="sf('later',this)">⏳ LATER</button>
  <div class="vsep"></div>
  <button class="fb"            onclick="sf('high',this)">높은 우선순위만</button>
</div>

<div class="legend-row">
  <div class="li"><span class="ld" style="background:#d4ff4e"></span>빠른 실행</div>
  <div class="li"><span class="ld" style="background:#4e9fff"></span>신중 검토</div>
  <div class="li"><span class="ld" style="background:#555"></span>후순위</div>
  <div class="li"><span class="ld" style="background:#ff6b35"></span>재검토</div>
  <div class="vsep"></div>
  <div class="li"><span class="ld" style="background:#E24B4A"></span>높음</div>
  <div class="li"><span class="ld" style="background:#EF9F27"></span>중간</div>
  <div class="li"><span class="ld" style="background:#639922"></span>낮음</div>
</div>

<div class="main">
  <div class="y-axis">
    <div class="y-lbl">↑ 높은 우선순위&nbsp;&nbsp;낮은 우선순위 ↓</div>
  </div>
  <div class="matrix-col">
    <div class="col-hdrs">
      <div class="ch">낮은 복잡도</div>
      <div class="ch">중간 복잡도</div>
      <div class="ch">높은 복잡도</div>
    </div>
    <div class="gwr">
      <div class="row-labels">
        <div class="rl">높음</div>
        <div class="rl">중간</div>
        <div class="rl">낮음</div>
      </div>
      <div class="grid" id="mg"></div>
    </div>
    <div class="x-axis">
      <span class="xl">← 낮은 복잡도</span>
      <div class="xline"></div>
      <span class="xl">높은 복잡도 →</span>
    </div>
  </div>
</div>

<div class="sbar" id="sb">초기 데이터 표시 중 — Notion Token 입력 후 업데이트 버튼 클릭</div>

<!-- Detail -->
<div class="overlay" id="ov" onclick="ovc(event)">
  <div class="panel">
    <button class="pclose" onclick="cp()">×</button>
    <div class="pbadges" id="pb"></div>
    <div class="ptitle" id="pt"></div>
    <div id="pbody"></div>
  </div>
</div>

<script>
const DB="35a7837188b2802997f9ffdb4bcf4b1a";
const PO=["높음","중간","낮음"],CO=["낮음","중간","높음"];
const PD={"높음":"#E24B4A","중간":"#EF9F27","낮음":"#639922"};

const INIT=[
  {name:"초보자 모드 제공",priority:"중간",complexity:"높음",problem:"초보자들은 상품 명칭이 낯설어서 상품리스트 진입 전에 포기한다",solution:"초보자모드 화면을 제공하면 상품리스트까지 진입이 증가할 것이다"},
  {name:"광고 및 배너 노출 확대",priority:"낮음",complexity:"높음",problem:"상품에 대한 광고와 배너가 부족하다",solution:"최근 핫한 상품군으로 배너 노출하면 상품 가입율이 증가할 것이다"},
  {name:"외화채권 화면 상단 설명 축소 및 리스트 우선 노출",priority:"높음",complexity:"낮음",problem:"외화채권 메뉴까지는 들어왔는데 이후 어디로 들어가야 할지 모르겠다",solution:"상단 설명 축소 후 채권 리스트가 바로 보이게 하면 가입율이 올라갈 것이다"},
  {name:"계좌번호 복사 및 채우기(입금) 버튼 추가",priority:"중간",complexity:"낮음",problem:"매수 자금이 부족하면 화면 이탈이 일어난다",solution:"계좌번호 복사 기능으로 바로 이체 가능하면 매수 완료율이 증가할 것이다"},
  {name:"스크롤 안내 UI 표시",priority:"낮음",complexity:"낮음",problem:"스크롤이 너무 길어 무섭다",solution:"스크롤 모양 표시로 정보 탐색 가능성을 안내하면 이탈이 낮아질 것이다"},
  {name:"게이트 화면 탭 메뉴화",priority:"높음",complexity:"높음",problem:"게이트 화면에서 너무 많은 것을 보여주려다 보니 가치전달이 명확하지 않다",solution:"각 TAB의 화면을 게이트 화면에 메뉴화 한다"},
  {name:"매수 이어하기 기능 추가",priority:"중간",complexity:"높음",problem:"매수 진행 시 이탈한 경우 처음부터 다시 시작해야 한다",solution:"이어서 가입하기 버튼으로 완료율이 증가할 것이다"},
  {name:"펀드 일괄매수 기능 도입",priority:"높음",complexity:"낮음",problem:"한번에 여러가지 펀드를 사고 싶다",solution:"펀드 일괄매수 처리를 만들면 가입금액이 증가할 것이다"},
  {name:"매수 완료 후 재거래 진입점 노출 확대",priority:"낮음",complexity:"중간",problem:"매수 완료 후 다양한 재거래에 대한 진입점 노출이 부족하다",solution:"재거래 서비스 진입점을 노출시키면 추가납입이 증가할 것이다"},
  {name:"검색결과 게이트메뉴 우선노출 및 분류",priority:"중간",complexity:"낮음",problem:"키워드 검색 시 사용성 낮은 메뉴들이 더 위에 위치함",solution:"게이트메뉴를 최상단에 노출하면 진입 결정이 쉬워질 것이다"},
  {name:"상세화면 가독성 개선 및 핵심요약 제공",priority:"높음",complexity:"높음",problem:"핵심 정보가 너무 많고 어렵다. 이 상품을 왜 사야하는지 모르겠다",solution:"세줄 요약 등의 기능으로 가입율이 증가할 것이다"},
  {name:"펀드리스트 종목 선택 시 상세로 즉시 이동",priority:"높음",complexity:"중간",problem:"종목 선택 시 상세정보/펀드매수 두 버튼이 동일한 랜딩인데 나누어져 있다",solution:"바로 상세정보로 이동하면 전환율이 증가할 것이다"},
  {name:"상품 탭 메뉴화",priority:"높음",complexity:"높음",problem:"하나의 화면에 TAB으로 상품들이 구성되어 있어 거부감이 든다",solution:"각 상품 TAB을 메뉴화해서 목적있는 진입 고객율을 높인다"},
  {name:"1분 펀드 매수 가이드 제공",priority:"높음",complexity:"중간",problem:"초보투자자인 경우 진입장벽이 높다",solution:"펀드 1분 매수 가이드 제공으로 상품 가입율이 증가할 것이다"},
  {name:"테마 리스트 순위 및 정렬조건 노출",priority:"중간",complexity:"높음",problem:"테마별 리스트의 나열 기준이 없어 추가 탐색이 필요하다",solution:"순위 및 정렬 조건 노출로 상세화면 전환율이 증가할 것이다"},
  {name:"ELS 주요 메뉴 시각적 바로가기 제공",priority:"낮음",complexity:"중간",problem:"ELS 청약 시 사용하는 메뉴는 거의 동일한데 늘 헷갈리는 메뉴가 많다",solution:"많이 이용하는 메뉴만 시각적으로 바로 보여주면 이탈율을 낮출 수 있다"},
  {name:"게이트 화면 내 안내성 넛지/가이드 제공",priority:"높음",complexity:"높음",problem:"게이트화면에서 뭘 눌러야 할지 몰라서 머뭇거리다 이탈한다",solution:"5초간 아무 동작이 없으면 안내성 컨텐츠를 제공하면 진입이 증가할 것이다"},
  {name:"매수 후 자동이체/추가납입 약정 유도",priority:"낮음",complexity:"중간",problem:"펀드 매수 완료 후 적립식의 경우 자동이체를 별도로 설정해야 한다",solution:"추가납입 의사 고객에게 이체약정 추가 설정을 유도하면 가입율이 증가할 것이다"},
  {name:"일·주 단위 펀드 모으기 메뉴 신설",priority:"높음",complexity:"중간",problem:"펀드 매수가 일회성으로 끝난다",solution:"일/주 펀드 모으기 메뉴를 별도로 구성하면 적립식 가입율이 증가할 것이다"},
  {name:"게이트 화면 상세메뉴 가이드 문구 제공",priority:"낮음",complexity:"높음",problem:"게이트 화면이 막막하다",solution:"상세메뉴의 가이드 문구가 제공되면 막연함을 낮출 수 있을 것이다"},
  {name:"게이트 상세메뉴 행동순서 기반 재구성",priority:"낮음",complexity:"높음",problem:"",solution:"고객행동 순서에 따른 메뉴구성으로 설계하면 다음단계 이탈률을 낮출 수 있다"},
  {name:"가입자수/실시간 가입 넛지 배너 노출",priority:"중간",complexity:"중간",problem:"추천상품이 눈에 확 들어오지 않는다",solution:"넛지 배너로 실시간 가입 현황 강조하면 가입율이 증가할 것이다"},
  {name:"필수 확인사항 자동 전환 처리",priority:"낮음",complexity:"낮음",problem:"상세화면 진입하자마자 매수버튼이 비활성화되어 당황스럽다",solution:"필수 확인사항 자동 전환 처리로 매수프로세스 전환율이 증가할 것이다"},
];

let items=[...INIT],cf="all";

function gz(p,c){
  if(p==="높음"&&c==="낮음") return{l:"빠른 실행",col:"#d4ff4e",cls:"zn"};
  if(p==="높음"&&c==="중간") return{l:"빠른 실행",col:"#d4ff4e",cls:"zn"};
  if(p==="높음"&&c==="높음") return{l:"신중 검토",col:"#4e9fff",cls:"zl"};
  if(p==="중간"&&c==="낮음") return{l:"빠른 실행",col:"#d4ff4e",cls:"zn"};
  if(p==="중간"&&c==="중간") return{l:"신중 검토",col:"#4e9fff",cls:"zl"};
  if(p==="중간"&&c==="높음") return{l:"신중 검토",col:"#4e9fff",cls:"zl"};
  if(p==="낮음"&&c==="높음") return{l:"재검토",col:"#ff6b35",cls:"zr"};
  return{l:"후순위",col:"#555",cls:"zd"};
}
function inow(p,c){return(p==="높음"&&(c==="낮음"||c==="중간"))||(p==="중간"&&c==="낮음")}

function fi(){
  if(cf==="now")  return items.filter(i=>inow(i.priority,i.complexity));
  if(cf==="later")return items.filter(i=>!inow(i.priority,i.complexity));
  if(cf==="high") return items.filter(i=>i.priority==="높음");
  return items;
}

function sf(f,btn){
  cf=f;
  document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function ubadges(){
  const n=items.filter(i=>inow(i.priority,i.complexity)).length;
  document.getElementById("tb").textContent=items.length+"개 항목";
  document.getElementById("nb").textContent="🔥 NOW "+n;
  document.getElementById("lb").textContent="⏳ LATER "+(items.length-n);
}

function render(){
  const g=document.getElementById("mg");
  g.innerHTML="";
  const vis=fi();
  PO.forEach(p=>CO.forEach(c=>{
    const z=gz(p,c);
    const cell=document.createElement("div");
    cell.className="cell "+z.cls;
    const zb=document.createElement("div");
    zb.className="czb";
    zb.innerHTML=`<span class="zdot" style="background:${z.col}"></span>${z.l}`;
    cell.appendChild(zb);
    const ci=vis.filter(i=>i.priority===p&&i.complexity===c);
    if(!ci.length){
      const em=document.createElement("span");
      em.className="empty-c";em.textContent="—";cell.appendChild(em);
    } else {
      const cards=document.createElement("div");
      cards.className="cards";
      ci.forEach(item=>{
        const cd=document.createElement("div");
        cd.className="card";cd.onclick=()=>od(item);
        const h=document.createElement("div");h.className="card-hdr";
        const dot=document.createElement("span");dot.className="pdot";dot.style.background=PD[item.priority]||"#888";
        const nm=document.createElement("span");nm.className="cname";nm.textContent=item.name;
        h.appendChild(dot);h.appendChild(nm);cd.appendChild(h);
        const m=document.createElement("div");m.className="cmeta";
        const t1=document.createElement("span");t1.className="ctag";t1.textContent="우선순위 "+item.priority;
        const t2=document.createElement("span");t2.className="ctag";t2.textContent="복잡도 "+item.complexity;
        const t3=document.createElement("span");t3.className="ctag "+(inow(item.priority,item.complexity)?"cnow":"clater");
        t3.textContent=inow(item.priority,item.complexity)?"NOW":"LATER";
        m.appendChild(t1);m.appendChild(t2);m.appendChild(t3);cd.appendChild(m);
        cards.appendChild(cd);
      });
      cell.appendChild(cards);
    }
    g.appendChild(cell);
  }));
}

function od(item){
  const z=gz(item.priority,item.complexity);
  const n=inow(item.priority,item.complexity);
  document.getElementById("pt").textContent=item.name;
  document.getElementById("pb").innerHTML=`
    <span class="pb" style="border-color:${PD[item.priority]};color:${PD[item.priority]}">우선순위 ${item.priority}</span>
    <span class="pb">복잡도 ${item.complexity}</span>
    <span class="pb" style="border-color:${z.col};color:${z.col}">${z.l}</span>
    <span class="pb" style="border-color:${n?"#ff6b35":"#4e9fff"};color:${n?"#ff6b35":"#4e9fff"}">${n?"🔥 NOW":"⏳ LATER"}</span>`;
  const b=document.getElementById("pbody");b.innerHTML="";
  if(item.problem){
    b.innerHTML+=`<div class="psec"><div class="pslbl">Problem (이슈)</div><div class="pstxt">${item.problem}</div></div><div class="pdiv"></div>`;
  }
  if(item.solution){
    b.innerHTML+=`<div class="psec"><div class="pslbl">Solution</div><div class="pstxt">${item.solution}</div></div>`;
  }
  document.getElementById("ov").classList.add("open");
}
function ovc(e){if(e.target===document.getElementById("ov"))cp();}
function cp(){document.getElementById("ov").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cp();});

function serr(m){const el=document.getElementById("err");if(m){el.textContent=m;el.style.display="block";}else el.style.display="none";}
function np(r){if(!r)return null;if(r.includes("높음"))return"높음";if(r.includes("중간"))return"중간";if(r.includes("낮음"))return"낮음";return null;}

async function load(){
  const tok=document.getElementById("ti").value.trim();
  if(!tok){serr("Notion Integration Token을 입력해주세요.");return;}
  const btn=document.getElementById("rb"),bi=document.getElementById("bi");
  btn.disabled=true;
  bi.outerHTML='<span class="spin" id="bi"></span>';
  serr("");
  document.getElementById("sb").textContent="노션 데이터베이스 조회 중…";
  try{
    const loaded=[];let cursor;
    do{
      const body={page_size:100};if(cursor)body.start_cursor=cursor;
      const res=await fetch(`https://api.notion.com/v1/databases/${DB}/query`,{
        method:"POST",
        headers:{"Authorization":"Bearer "+tok,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const e=await res.json().catch(()=>({}));
        if(res.status===401)throw new Error("인증 실패 — Token을 확인해주세요.");
        if(res.status===404)throw new Error("DB를 찾을 수 없음 — Integration 연결을 확인하세요.");
        throw new Error(e.message||`API 오류 (${res.status})`);
      }
      const d=await res.json();
      d.results.forEach(pg=>{
        const p=pg.properties||{};
        const name=p["요약"]?.title?.[0]?.plain_text||"";
        const problem=p["Problem(이슈)"]?.rich_text?.[0]?.plain_text||"";
        const solution=p["Solution"]?.rich_text?.[0]?.plain_text||"";
        const priority=np(p["우선순위"]?.select?.name||"");
        const complexity=np(p["복잡도"]?.select?.name||"");
        if(name&&priority&&complexity)loaded.push({name,priority,complexity,problem,solution});
      });
      cursor=d.has_more?d.next_cursor:undefined;
    } while(cursor);
    if(!loaded.length)throw new Error("조건에 맞는 항목이 없습니다.");
    items=loaded;ubadges();render();
    document.getElementById("sb").textContent=`업데이트: ${new Date().toLocaleString("ko-KR")} · ${loaded.length}개 로드됨`;
  }catch(e){
    serr("오류: "+e.message);
    document.getElementById("sb").textContent="업데이트 실패 — 기존 데이터 유지";
  }finally{
    btn.disabled=false;
    const el=document.getElementById("bi");
    if(el)el.outerHTML='<span id="bi">↻</span>';
  }
}

ubadges();render();
</script>
</body>
</html>
